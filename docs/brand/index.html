<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo StudyKids</title>
    <link rel="icon" href="favicon.svg" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #1b1340; background: #fff8f2; }
      main { max-width: 960px; margin: 0 auto; padding: 16px; }
      h1, h2 { margin: 24px 0 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; }
      .tile { padding: 16px; border-radius: 16px; display: grid; gap: 8px; justify-items: center; font-size: 14px; }
      .light { background: #fff; border: 1px solid #e6dccf; }
      .dark { background: #1b1340; color: #fff; }
      .tile img { display: block; max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>Logo StudyKids &mdash; Kiko</h1>
      <h2>Horizontal</h2>
      <div class="row">
        <div class="tile light"><img src="logo-horizontal.svg" width="300" alt="" />Warna penuh</div>
        <div class="tile light"><img src="logo-horizontal-ink.svg" width="300" alt="" />Satu warna (Ink)</div>
        <div class="tile dark"><img src="logo-horizontal-white.svg" width="300" alt="" />Putih</div>
      </div>
      <h2>Ikon Kiko &mdash; ukuran 32 / 48 / 192</h2>
      <div class="row">
        <div class="tile light"><img src="kiko-icon.svg" width="32" height="32" alt="" />32</div>
        <div class="tile light"><img src="kiko-icon.svg" width="48" height="48" alt="" />48</div>
        <div class="tile light"><img src="kiko-icon.svg" width="192" height="192" alt="" />192</div>
        <div class="tile light"><img src="kiko-icon-ink.svg" width="32" height="32" alt="" />Ink 32</div>
        <div class="tile light"><img src="kiko-icon-ink.svg" width="192" height="192" alt="" />Ink 192</div>
        <div class="tile dark"><img src="kiko-icon-white.svg" width="32" height="32" alt="" />Putih 32</div>
        <div class="tile dark"><img src="kiko-icon-white.svg" width="192" height="192" alt="" />Putih 192</div>
        <div class="tile dark"><img src="kiko-icon.svg" width="32" height="32" alt="" />Warna 32 (gelap)</div>
      </div>
      <h2>Aplikasi (PNG)</h2>
      <div class="row">
        <div class="tile light"><img src="favicon-32.png" width="32" height="32" alt="" />favicon 32</div>
        <div class="tile light"><img src="pwa-192.png" width="192" height="192" alt="" />PWA 192</div>
        <div class="tile light"><img src="maskable-512.png" width="192" height="192" alt="" />Maskable 512</div>
      </div>
    </main>
  </body>
</html>
