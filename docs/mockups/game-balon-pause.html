<!doctype html>
<html lang="id" data-lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini game dijeda — Mockup StudyKids</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/mockup.css">
<link rel="stylesheet" href="assets/soal.css">
<script src="assets/mockup.js" defer></script>
</head>
<body>
<header class="g-top">
  <div class="g-stats"><span class="badge"><span lang="id">Skor</span><span lang="en">Score</span> 40</span><span class="badge" role="timer" aria-label="Waktu berhenti / Time stopped">⏱ 0:45</span></div>
  <button class="btn btn-secondary" type="button" data-lang-toggle aria-label="ID / EN, ganti bahasa">ID / EN</button>
</header>
<main class="container q-main stack">
  <section class="overlay stack" aria-labelledby="t">
    <img src="../brand/kiko/kiko-tidur.svg" alt="Kiko tidur" width="120" height="120">
    <h1 id="t"><span lang="id">Game dijeda</span><span lang="en">Game paused</span></h1>
    <p><span lang="id">Waktu berhenti. Lanjut kapan saja!</span><span lang="en">The clock is stopped. Continue any time!</span></p>
    <a class="btn btn-block" href="game-balon.html"><span lang="id">Lanjut main</span><span lang="en">Resume</span></a>
    <a class="btn btn-secondary btn-block" href="game-balon-hasil.html"><span lang="id">Selesai sekarang</span><span lang="en">Finish now</span></a>
    <a class="btn btn-secondary btn-block" href="peta-belajar.html"><span lang="id">Keluar</span><span lang="en">Leave</span></a>
  </section>
</main>
</body>
</html>
