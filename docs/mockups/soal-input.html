<!doctype html>
<html lang="id" data-lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soal isian angka — Mockup StudyKids</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/mockup.css">
<link rel="stylesheet" href="assets/soal.css">
<script src="assets/mockup.js" defer></script>
<script src="assets/soal.js" defer></script>
</head>
<body>
<header class="q-top">
  <a class="close" href="peta-belajar.html" aria-label="Keluar dari sesi / Leave session">✕</a>
  <div class="q-progress">
    <span class="label"><span lang="id">Soal 5 dari 10</span><span lang="en">Question 5 of 10</span></span>
    <div class="bar" role="progressbar" aria-label="Progres sesi" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5"><span style="width:50%"></span></div>
  </div>
  <button class="btn btn-secondary" type="button" data-lang-toggle aria-label="ID / EN, ganti bahasa">ID / EN</button>
</header>
<main class="container q-main stack">
  <div class="q-prompt">
    <h1><span lang="id">Ketik hasilnya: 6 + 5 = ?</span><span lang="en">Type the answer: 6 + 5 = ?</span></h1>
    <button class="btn btn-secondary speak" type="button" aria-label="Dengarkan soal / Read aloud">🔊</button>
  </div>
  <div class="answer-box" id="ans" role="status" aria-label="Jawabanmu">?</div>
  <div class="keypad" data-keypad="ans"><button class="choice" type="button" data-key="1">1</button><button class="choice" type="button" data-key="2">2</button><button class="choice" type="button" data-key="3">3</button><button class="choice" type="button" data-key="4">4</button><button class="choice" type="button" data-key="5">5</button><button class="choice" type="button" data-key="6">6</button><button class="choice" type="button" data-key="7">7</button><button class="choice" type="button" data-key="8">8</button><button class="choice" type="button" data-key="9">9</button><button class="choice" type="button" data-key="del" aria-label="Hapus">⌫</button><button class="choice" type="button" data-key="0">0</button></div>
</main>
<nav class="bottom-bar" aria-label="Aksi"><a class="btn btn-block" href="feedback-salah.html"><span lang="id">Periksa</span><span lang="en">Check</span></a></nav>
</body>
</html>
