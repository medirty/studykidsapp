<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Icon: open book whose pages form a smile, with a star above -->
  <g transform="translate(16,8)">
    <rect x="0" y="0" width="144" height="144" rx="36" fill="#2459D6"/>
    <!-- star -->
    <path d="M72 18 L80.2 34.6 L98.5 37.3 L85.2 50.2 L88.4 68.4 L72 59.8 L55.6 68.4 L58.8 50.2 L45.5 37.3 L63.8 34.6 Z" fill="#FFC93C"/>
    <!-- book pages (smile) -->
    <path d="M24 82 Q48 72 72 88 Q96 72 120 82 L120 112 Q96 102 72 120 Q48 102 24 112 Z" fill="#FFFFFF"/>
    <!-- spine / smile line -->
    <path d="M38 96 Q72 122 106 96" fill="none" stroke="#FF8A1F" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="182" y="106" font-family="'Baloo 2','Nunito','Arial Rounded MT Bold',Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-1">
    <tspan fill="#2459D6">study</tspan><tspan fill="#FF8A1F">kids</tspan>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
