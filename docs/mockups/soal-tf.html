<!doctype html>
<html lang="id" data-lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soal benar atau salah — Mockup StudyKids</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/mockup.css">
<link rel="stylesheet" href="assets/soal.css">
<script src="assets/mockup.js" defer></script>
<script src="assets/soal.js" defer></script>
</head>
<body>
<header class="q-top">
  <a class="close" href="peta-belajar.html" aria-label="Keluar dari sesi / Leave session">✕</a>
  <div class="q-progress">
    <span class="label"><span lang="id">Soal 4 dari 10</span><span lang="en">Question 4 of 10</span></span>
    <div class="bar" role="progressbar" aria-label="Progres sesi" aria-valuemin="0" aria-valuemax="10" aria-valuenow="4"><span style="width:40%"></span></div>
  </div>
  <button class="btn btn-secondary" type="button" data-lang-toggle aria-label="ID / EN, ganti bahasa">ID / EN</button>
</header>
<main class="container q-main stack">
  <div class="q-prompt">
    <h1><span lang="id">Betul atau salah? Segitiga punya 3 sisi.</span><span lang="en">True or false? A triangle has 3 sides.</span></h1>
    <button class="btn btn-secondary speak" type="button" aria-label="Dengarkan soal / Read aloud">🔊</button>
  </div>
  <p class="q-visual" role="img" aria-label="Segitiga">🔺</p>
  <ul class="choices" data-choices><li><button class="choice" type="button" aria-pressed="false">✓ <span lang="id">Benar</span><span lang="en">True</span></button></li><li><button class="choice" type="button" aria-pressed="false">✗ <span lang="id">Salah</span><span lang="en">False</span></button></li></ul>
</main>
<nav class="bottom-bar" aria-label="Aksi"><button class="btn btn-block" type="button"><span lang="id">Periksa</span><span lang="en">Check</span></button></nav>
</body>
</html>
