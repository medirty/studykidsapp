<!doctype html>
<html lang="id" data-lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soal pilihan ganda (kelas 1) — Mockup StudyKids</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/mockup.css">
<link rel="stylesheet" href="assets/soal.css">
<script src="assets/mockup.js" defer></script>
<script src="assets/soal.js" defer></script>
</head>
<body>
<header class="q-top">
  <a class="close" href="peta-belajar.html" aria-label="Keluar dari sesi / Leave session">✕</a>
  <div class="q-progress">
    <span class="label"><span lang="id">Soal 3 dari 10</span><span lang="en">Question 3 of 10</span></span>
    <div class="bar" role="progressbar" aria-label="Progres sesi" aria-valuemin="0" aria-valuemax="10" aria-valuenow="3"><span style="width:30%"></span></div>
  </div>
  <button class="btn btn-secondary" type="button" data-lang-toggle aria-label="ID / EN, ganti bahasa">ID / EN</button>
</header>
<main class="container q-main stack">
  <div class="q-prompt">
    <h1><span lang="id">Ada 3 apel merah dan 4 apel hijau. Berapa semua apel?</span><span lang="en">There are 3 red apples and 4 green apples. How many apples in all?</span></h1>
    <button class="btn btn-secondary speak" type="button" aria-label="Dengarkan soal / Read aloud">🔊</button>
  </div>
  <p class="q-visual" role="img" aria-label="3 apel merah, 4 apel hijau">🍎🍎🍎🍏🍏🍏🍏</p>
  <ul class="choices" data-choices><li><button class="choice" type="button" aria-pressed="false">6</button></li><li><button class="choice" type="button" aria-pressed="false">7</button></li><li><button class="choice" type="button" aria-pressed="false">8</button></li><li><button class="choice" type="button" aria-pressed="false">12</button></li></ul>
</main>
<nav class="bottom-bar" aria-label="Aksi"><button class="btn btn-block" type="button"><span lang="id">Periksa</span><span lang="en">Check</span></button></nav>
</body>
</html>
