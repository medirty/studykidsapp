<!doctype html>
<html lang="id" data-lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soal ketuk gambar — Mockup StudyKids</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/mockup.css">
<link rel="stylesheet" href="assets/soal.css">
<script src="assets/mockup.js" defer></script>
<script src="assets/soal.js" defer></script>
</head>
<body>
<header class="q-top">
  <a class="close" href="peta-belajar.html" aria-label="Keluar dari sesi / Leave session">✕</a>
  <div class="q-progress">
    <span class="label"><span lang="id">Soal 2 dari 10</span><span lang="en">Question 2 of 10</span></span>
    <div class="bar" role="progressbar" aria-label="Progres sesi" aria-valuemin="0" aria-valuemax="10" aria-valuenow="2"><span style="width:20%"></span></div>
  </div>
  <button class="btn btn-secondary" type="button" data-lang-toggle aria-label="ID / EN, ganti bahasa">ID / EN</button>
</header>
<main class="container q-main stack">
  <div class="q-prompt">
    <h1><span lang="id">Ketuk segitiga!</span><span lang="en">Tap the triangle!</span></h1>
    <button class="btn btn-secondary speak" type="button" aria-label="Dengarkan soal / Read aloud">🔊</button>
  </div>
  <ul class="choices" data-choices>
    <li><button class="choice" type="button" aria-pressed="false" aria-label="Lingkaran"><svg class="shape" viewBox="0 0 64 64" aria-hidden="true" fill="currentColor"><circle cx="32" cy="32" r="26"/></svg></button></li><li><button class="choice" type="button" aria-pressed="false" aria-label="Segitiga"><svg class="shape" viewBox="0 0 64 64" aria-hidden="true" fill="currentColor"><polygon points="32,6 60,58 4,58"/></svg></button></li>
    <li><button class="choice" type="button" aria-pressed="false" aria-label="Persegi"><svg class="shape" viewBox="0 0 64 64" aria-hidden="true" fill="currentColor"><rect x="8" y="8" width="48" height="48"/></svg></button></li><li><button class="choice" type="button" aria-pressed="false" aria-label="Bintang"><svg class="shape" viewBox="0 0 64 64" aria-hidden="true" fill="currentColor"><polygon points="32,4 40,24 61,25 45,39 50,60 32,48 14,60 19,39 3,25 24,24"/></svg></button></li></ul>
</main>
<nav class="bottom-bar" aria-label="Aksi"><button class="btn btn-block" type="button"><span lang="id">Periksa</span><span lang="en">Check</span></button></nav>
</body>
</html>
