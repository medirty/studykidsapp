<!doctype html>
<html lang="id" data-lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soal pilihan ganda (kelas 5–6) — Mockup StudyKids</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/mockup.css">
<link rel="stylesheet" href="assets/soal.css">
<script src="assets/mockup.js" defer></script>
<script src="assets/soal.js" defer></script>
</head>
<body>
<header class="q-top">
  <a class="close" href="peta-belajar.html" aria-label="Keluar dari sesi / Leave session">✕</a>
  <div class="q-progress">
    <span class="label"><span lang="id">Soal 6 dari 10</span><span lang="en">Question 6 of 10</span></span>
    <div class="bar" role="progressbar" aria-label="Progres sesi" aria-valuemin="0" aria-valuemax="10" aria-valuenow="6"><span style="width:60%"></span></div>
  </div>
  <button class="btn btn-secondary" type="button" data-lang-toggle aria-label="ID / EN, ganti bahasa">ID / EN</button>
</header>
<main class="container q-main stack">
  <div class="q-prompt">
    <h1><span lang="id">Pecahan ¾ sama dengan bilangan desimal…</span><span lang="en">The fraction ¾ is equal to the decimal…</span></h1>
    <button class="btn btn-secondary speak" type="button" aria-label="Dengarkan soal / Read aloud">🔊</button>
  </div>
  <ul class="choices list" data-choices><li><button class="choice" type="button" aria-pressed="false">A. 0,34</button></li><li><button class="choice" type="button" aria-pressed="false">B. 0,75</button></li><li><button class="choice" type="button" aria-pressed="false">C. 0,25</button></li><li><button class="choice" type="button" aria-pressed="false">D. 3,4</button></li></ul>
</main>
<nav class="bottom-bar" aria-label="Aksi"><button class="btn btn-block" type="button"><span lang="id">Periksa</span><span lang="en">Check</span></button></nav>
</body>
</html>
