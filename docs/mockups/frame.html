<script>
  // Hanya nama file HTML di folder ini (cegah URL lain).
  var s = new URLSearchParams(location.search).get('src') || 'index.html';
  document.getElementById('f').src = /^[a-z0-9-]+\.html$/.test(s) ? s : 'index.html';
</script>
